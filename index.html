<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <title>Choir Practice Helper</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                align-items: center;
                justify-content: center;
                margin: 0 auto;
            }

            a,
            header,
            p {
                text-align: center;
            }

            div {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
            }

            button {
                font-size: 3rem;
                margin: 5px;
                padding: 5px;
                background-color: rgb(251, 184, 41);
                color: black;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                text-align: left;
            }

            button[class="muteButton"] {
                width: 4.7rem;
            }

            button:hover {
                background-color: #45b300;
            }

            label,
            input[type="range"] {
                padding-top: 15px;
                padding-bottom: 15px;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>Choir Practice Helper</h1>
        </header>
        <main>
            <p>A simple voice mixer to practice different choir parts.</p>
            <p>Use the buttons to play/pause/stop all parts,
                <br>or change volume and pan (left/right) presets.
            </p>
            <p><b>Use 🎧 for the best experience!</b></p>
            <div>
                <label for="songSelect">Pick a Song: </label>
                <select id="songSelect">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <p id="safariWarning"></p>
            <p id="audioStatus" aria-live="polite" style="color: #666;"></p>

            <div>
                <button type="button" id="playPause"
                    onclick="playPause()">▶️</button>
                <button type="button" id="stop" onclick="stop()"
                    disabled>⬅️</button>
            </div>
            <div id="trackProgressContainer" style="display:none">
                <input id="trackProgress" title="Track Progress" type="range"
                    min="0" max="100" value="0"
                    onchange="seekTrack(this.value)">
                <label id="progressLabel">0:00 / 0:00</label>
            </div>
            <div id="trackVolumes" style="display:block"></div>
            <div id="backingVolumeControl" style="display:none">
                <label>Backing Volume: </label>
                <input title="Backing Volume" id="backingVolume" type="range"
                    class="volume" min="0" max="1" value="0.20" step="0.05"
                    oninput="changeVolume(this.value, 'other')">
            </div>
            <div id="panningControls" style="display:block"></div>
            <div id="panPresets" style="display:none">
                <button id="presetChoirStereo">BTAS</button>
                <button id="presetLeaderStereo">SATB</button>
                <button id="presetFullMono">⚖️</button>
            </div>
        </main>
        <aside>
            <p>
                <a href="https://github.com/MisterZeus/choir-practice-helper/">
                    Source Code</a>
            </p>
        </aside>
        <script src="choir-practice-helper.js"></script>
    </body>

</html>
