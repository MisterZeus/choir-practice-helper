<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <title>Choir Practice Helper</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                align-items: center;
                justify-content: center;
                margin: 0 auto;
            }

            a,
            header,
            p {
                text-align: center;
            }

            div {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
            }

            button {
                font-size: 3rem;
                margin: 5px;
                padding: 5px;
                background-color: rgb(251, 184, 41);
                color: black;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                text-align: left;
            }

            button[id="muteSoprano"],
            button[id="muteAlto"],
            button[id="muteTenor"],
            button[id="muteBass"] {
                width: 4.7rem;
            }

            button:hover {
                background-color: #45b300;
            }

            label,
            input[type="range"] {
                padding-top: 15px;
                padding-bottom: 15px;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>Choir Practice Helper</h1>
        </header>
        <main>
            <p>A simple voice mixer to practice different choir parts.</p>
            <p>Use the buttons to play/pause/stop all parts,
                <br>or change volume and pan (left/right) presets.
            </p>
            <p><b>Use 🎧 for the best experience!</b></p>
            <p id="safariWarning"></p>
            <p id="audioStatus" aria-live="polite" style="color: #666;"></p>

            <div>
                <button type="button" id="playPause"
                    onclick="playPause()">▶️</button>
                <button type="button" id="stop" onclick="stop()"
                    disabled>⬅️</button>
            </div>
            <div>
                <input id="trackProgress" title="Track Progress" type="range"
                    min="0" max="100" value="0"
                    onchange="seekTrack(this.value)">
                <label id="progressLabel">0:00 / 0:00</label>
            </div>
            <div id="trackVolumes" style="display:block">
                <div>
                    <label>S</label>
                    <button id="muteSoprano" onclick="muteTrack(0)">🔊</button>
                    <input title="Soprano Volume" type="range"
                        class="trackVolume" min="0" max="1" value="1"
                        step="0.05" disabled
                        oninput="changeVolume(this.value, 'soprano')">
                    <button id="presetSop">🦸</button>
                </div>
                <div>
                    <label>A</label>
                    <button id="muteAlto" onclick="muteTrack(1)">🔊</button>
                    <input title="Alto Volume" type="range" class="trackVolume"
                        min="0" max="1" value="1" step="0.05" disabled
                        oninput="changeVolume(this.value, 'alto')">
                    <button id="presetAlto">🦸</button>
                </div>
                <div>
                    <label>T</label>
                    <button id="muteTenor" onclick="muteTrack(2)">🔊</button>
                    <input title="Tenor Volume" type="range" class="trackVolume"
                        min="0" max="1" value="1" step="0.05" disabled
                        oninput="changeVolume(this.value, 'tenor')">
                    <button id="presetTenor">🦸</button>
                </div>
                <div>
                    <label>B</label>
                    <button id="muteBass" onclick="muteTrack(3)">🔊</button>
                    <input title="Bass Volume" type="range" class="trackVolume"
                        min="0" max="1" value="1" step="0.05" disabled
                        oninput="changeVolume(this.value, 'bass')">
                    <button id="presetBass">🦸</button>
                </div>
            </div>
            <div>
                <label>Backing Volume: </label>
                <input title="Backing Volume" id="backingVolume" type="range"
                    class="volume" min="0" max="1" value="0.20" step="0.05"
                    oninput="changeVolume(this.value, 'other')">
            </div>
            <div>
                <label>S Left </label>
                <input title="Soprano Pan" type="range" class="pan" min="-1"
                    max="1" value="1" step="0.1" disabled>
                <label>Right</label>
            </div>
            <div>
                <label>A Left</label>
                <input title="Alto Pan" type="range" class="pan" min="-1"
                    max="1" value="0.35" step="0.1" disabled>
                <label>Right</label>
            </div>
            <div>
                <label>T Left</label>
                <input title="Tenor Pan" type="range" class="pan" min="-1"
                    max="1" value="-0.35" step="0.1" disabled>
                <label>Right</label>
            </div>
            <div>
                <label>B Left</label>
                <input title="Bass Pan" type="range" class="pan" min="-1"
                    max="1" value="-1" step="0.1" disabled>
                <label>Right</label>
            </div>
            <div>
                <button id="presetChoirStereo">BTAS</button>
                <button id="presetLeaderStereo">SATB</button>
                <button id="presetFullMono">⚖️</button>
            </div>
        </main>
        <aside>
            <div>
                <a href="https://github.com/MisterZeus/choir-practice-helper/">Source
                    Code</a>
            </div>
        </aside>
        <script src="choir-practice-helper.js"></script>
    </body>

</html>
